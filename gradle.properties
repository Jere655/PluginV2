org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.java.home=C:/Java/jdk-21
# Paperweight's remapping toolchain for Paper 1.21.7 is validated on Java 21.
# Without this pin Gradle selects the system JDK 25, which fails before javac
# (and therefore before Lombok annotation processing) is ever invoked.
minecraftVersion = 1.21.7
paperWeightUserDevVersion = 2.0.0-beta.21

# Plugins
worldguardVersion = 7.0.16
craftEngineVersion = 26.8.1
luckpermsVersion = 5.5
placeholderApiVersion = 2.11.7
worldeditVersion = 7.4.0
fancyNpcsVersion = 2.9.2
protocolLibVersion = 5.4.0

# Dependencies
jetbrainsAnnotationsVersion = 26.1.0
revxrsalLampVersion = 4.0.0-rc.17
ormVersion = 6.1
lombokVersion = 1.18.46

# Test Dependencies
slf4jVersion = 2.1.0-alpha1
junitVersion = 6.1.1
mockbukkitVersion = 4.71.0
h2DatabaseVersion = 2.4.240
