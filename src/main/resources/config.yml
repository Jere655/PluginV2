#####
# Database (MySQL / MariaDB obligatoire)
#####
# OpenMC stocke toutes ses donnees persistantes en base : economie (argent, banque,
# transactions, bits), villes et mascottes, boutiques, homes, amis, boites aux lettres,
# parametres joueur, milestones, cooldowns, analytics, liaison Discord, contributeurs
# GitHub, evenements (quotidiens, hebdomadaires, contest, halloween) et les Reves.
# Le plugin ne demarre pas sans une base accessible.
#
# url      : URL JDBC complete, au format jdbc:mysql://<adresse>:<port>/<base>
#            La base (ici "openmc") doit deja exister sur le serveur MySQL/MariaDB.
# username : utilisateur MySQL/MariaDB ayant les droits sur cette base.
# password : mot de passe de cet utilisateur.
database:
  url: "jdbc:mysql://127.0.0.1:3306/openmc"
  username: ""
  password: ""

features:
  analytics: true
  transactions: true
  aywen_pelush:
    day: 3
    month: 11
    year: 2025

chat:
  # {prefix}, {suffix}, {name}, {message}
  message: "&r{prefix} {name}&8: &f{message}"

# Montant d'argent donné à un joueur lors de sa première connexion
money-on-first-join: 500

#####
# Paramètres pour un environnement de production
#####
homepage: "https://openmc.fr/"
discord: "https://aywen.fr/discord/"
blog: "https://blog.openmc.fr/"
wiki: "https://wiki.openmc.fr/"
repoV2: "https://github.com/ServerOpenMC/PluginV2"

#####
# Webhook
#####
error:
  notif: [ ]
  webhook: null